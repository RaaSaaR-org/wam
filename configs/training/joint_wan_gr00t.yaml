# WAM training config — T-16 LoRA fine-tune of Wan2.2-TI2V-5B on datasets/gr00t-apple-full.
# THE deliverable run (cluster/discoverer/50_train_t16.sbatch, one H200, 4 h + requeue).
#
# Identical action/state shapes to configs/training/joint_gr00t.yaml — that file is the CPU
# twin and the only thing that changes here is the backbone (and the optimizer scale that
# follows from it). Run the tiny twin first; if it does not survive a few steps, this one
# will not either, it will just burn GPU-hours finding out.
#
# The `training` section maps 1:1 onto wam.training.joint.JointTrainingConfig.
wam_config_version: "0.1.0"

training:
  seed: 0
  device: cuda
  # Two learning rates: the freshly initialized action branch (head, encoders, velocity head)
  # learns at 1e-3, the LoRA adapters on a pretrained DiT at 1e-4. One shared rate either
  # crawls on the new heads or tears up the pretrained video prior in the first hundred steps.
  lr: 0.001
  backbone_lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  batch_size: 8 # 9 frames of 128x160 latents + LoRA activations; 8 fits one H200 at bf16
  steps: 20000 # ~14.5k chunk samples (402 episodes x 36 chunks) -> ~11 epochs
  camera: ego
  limit_margin: 0.95

  weights: # PRD §10.4 loss inventory
    # video is downweighted to 0.5 ONLY here: with Wan the flow loss is computed in VAE
    # latent space (48 channels, normalized by latents_mean/std), not in the [0, 1] pixel
    # space the tiny backbone uses, so its magnitude is not comparable to the tiny run's.
    # Latent-space flow residuals are the larger of the two and at weight 1.0 they dominate
    # the gradient, leaving the action branch to learn on the remainder (R-07).
    video: 0.5
    action_flow: 1.0
    action_recon: 1.0 # encoder anchor (flow targets are detached from the encoder)
    action_reg: 1.0
    gripper: 0.5
    alignment: 0.1
    smoothness: 0.01
    limit: 0.001

  state: # StateMLPConfig (FR-02) — input width 15 q + 15 dq + 10 imu + 2 gripper = 42
    embedding_dim: 32
    hidden_dims: [64, 64]
    num_joints: 15
    gripper_dims: 2 # RobotState.gripper_state is per hand (left, right)
    use_layernorm: true
    activation: gelu

  # WanBackboneConfig (FR-09). Weight location (model_id/checkpoint_path) and the LoRA
  # surface live in configs/model/wan22_ti2v_5b.yaml, which the job passes as
  # --backbone-config alongside a machine-local --backbone-source; what stays here are the
  # fields JointTrainingConfig cross-validates against the rest of the model.
  backbone:
    kind: wan_i2v
    dtype: bfloat16
    device: cuda
    feature_dim: 3072 # DiT inner dim of the 5B variant; head.feature_dim must match
    num_frames: 9
    image_hw: [128, 160] # 120 is not a multiple of vae(16)*patch(2)=32; see the model config
    state_embedding_dim: 32
    max_text_tokens: 512
    feature_blocks: [2, 10] # measured readout depth; keep in sync with the model config

  action_encoder: # ActionChunkEncoderConfig (training only, PRD 9.5)
    latent_dim: 32
    hidden_dims: [64]
    target_dim: 15
    gripper_dims: 1 # ActionChunk.gripper_target is the mean of both hands' synergy
    max_steps: 32

  head: # ActionHeadConfig decoder on shared features (FR-04)
    feature_dim: 3072
    num_steps: 16 # convert_lerobot_g1.py --chunk-steps 16 (the recorded chunk length)
    target_dim: 15
    gripper_dims: 1
    mode: joint_delta
    dt_s: 0.0333333 # 30 fps ego camera; the converter stamps dt from the parquet timestamps
    hidden_dims: [256] # one wide layer: 3072 -> 15 in a single 64-unit hop is a hard squeeze

  velocity_hidden_dims: [256] # ActionVelocityHead sees [z_t | 3072 pooled features | t]
