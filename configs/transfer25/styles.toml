# T-040 / PR-08 §5 — the committed TRAIN_STYLES / EVAL_STYLES partition for the photoreal
# augmentation of the real AppleToPlate corpus. Closes PR-08 §8 item 6.
#
# THIS FILE IS THE PRE-COMMITMENT. PR-08 §5: "The style pool is split into disjoint TRAIN_STYLES
# and EVAL_STYLES — as a committed file, in git, before the first clip — so the evaluation domain
# cannot be chosen after seeing which restyles came out well." The headline (§6) is arm B against
# arm A on the EVAL_STYLES set; if the members of that set could be picked after looking at
# generated clips, the headline measures the picking and not the augmentation.
#
# NOTHING HERE LICENSES GENERATION. PR-08 §1 forbids generating a corpus until every §8 item is
# closed and T-39 has reported. Committing this file is explicitly one of the things §1 *does*
# license, and it is all it does.
#
# WHY TOML AND NOT YAML. The repo has more .yaml configs, but they are runtime configs loaded by
# `wam` (robot, model, training, safety). The nearest neighbour by *genre* is
# configs/cosmos3/t041_eval_selection.toml — a pre-commitment for a Cosmos generation run under a
# pre-registration, with the argument for every value kept next to the value. That is exactly what
# this is, so it is written the same way. `tomllib` is stdlib on 3.11+; the verifier needs no
# dependency to read it.
#
# VERIFIER: scripts/check_style_partition.py (tests/test_style_partition.py runs it in CI).
# It checks disjointness, hash reproducibility, and that no style string contains a
# geometry-moving term. Run it before quoting the hash anywhere.

schema = "wam.style_partition/1"
# Versioned like a registered rule, for the same reason (docs/handoff.md §3): if a style turns out
# to be unusable, the fix is T40_STYLES_V2 committed alongside this, never an edit in place. An
# edit would change the content hash PR-08 §6 records and there would be no way to tell which
# partition a finished run actually used.
#
# AMENDED IN PLACE 2026-08-15, STILL V1, AND THE REASON MATTERS. The rule above protects a
# *finished run's* recorded hash: once clips exist under a digest, that digest must keep meaning
# the same partition. No clip exists. PR-08 §1 forbids generation until every §8 item is closed
# and T-39 has reported; nothing has been submitted, and the pre-amendment digest
# 4da3875d0c76e9b23821c1ca9fe20f965f9fc0867edcd085fb792b587a680da8 is recorded nowhere except in
# this file's own sidecar and its rendering. So the amendment orphans no record, and a V2 would
# have bought a second file to keep in sync in exchange for nothing.
#
# WHAT THE AMENDMENT CHANGED: arm C's sizing ([volume], [identity_style].repeats). The committed
# V1 shipped ONE identity style against TEN train styles, so arm C was 402 clips against arm B's
# 4020. PR-08 §5 requires arm C to be "same generator, same pipeline, SAME FRAME COUNT, no added
# diversity" — a 10x volume gap confounds "diversity helped" with "more data helped", which is the
# single confound arm C exists to remove, so V1 as committed could not have served its purpose.
# The identity style is now generated 10 times per episode under 10 committed seeds. Arm B is NOT
# subsampled: the fix raises C to B, it does not lower B to C. No style was added, dropped or
# re-slugged, and no style moved between the sets — the appearance partition names exactly what it
# named before, so nothing about which appearances are held out has changed.
#
# One prompt's WORDING did change in the same amendment, and it is recorded here so the digest
# change is fully accounted for rather than attributed entirely to the sizing: eval-01's "from the
# left" became "from one side" after the geometry lint grew a spatial-relation vocabulary. The
# reason is at the style itself; the light it describes and the slug it carries are unchanged.
#
# So the digest moved for three reasons, all of them content: the repeats, the clip counts, and
# that one rewording.
#
# SECOND AMENDMENT, SAME DAY, STILL V1, AND THIS ONE IS THE SEED SCHEDULE. The argument above
# carries over unchanged — no clip exists, so no record is orphaned — and what it repairs is the
# confound arm C exists to remove, re-entering through a field nobody was reading as part of the
# design.
#
#   AS COMMITTED EARLIER TODAY every TRAIN style and every EVAL style carried repeats = 1, and the
#   committed rule was "repeat r uses repeat_seeds[r]; a style with repeats = 1 uses
#   repeat_seeds[0]". Read literally — and the sbatch does read it literally — that means:
#     - arm B's 4 020 clips were ALL generated at seed 7001,
#     - the EVAL set's 2 010 clips were ALSO all at seed 7001,
#     - and arm C's 4 020 clips were the only ones spanning 7001-7010.
#   Two consequences, the second of which breaks the experiment:
#     1. arm B varied its PROMPT at a fixed seed while arm C varied its SEED at a fixed prompt, so
#        B − C was a difference between two effects rather than the isolation of one.
#     2. arm B's TRAINING clips shared their initial-noise seed with the EVAL clips the headline is
#        scored on, and arm C's mostly did not. Any transferable seed-specific generator
#        fingerprint therefore matches B's training distribution to the eval distribution more
#        closely than C's, and inflates B − C on the headline for a reason that has nothing to do
#        with diversity. That CAN MANUFACTURE A P, and it is exactly the confound arm C was added
#        to remove — re-entering through the seed schedule instead of through the clip counts.
#
#   THE REPAIR COSTS ZERO EXTRA CLIPS, and it is only available before the first clip exists. The
#   seed schedule is now a committed block of its own ([seed_schedule]), one seed per
#   style-instance, one block per set:
#     - TRAIN gets ten seeds, style i under blocks.train[i]. Arms B and C then span the IDENTICAL
#       ten seeds, and prompt diversity becomes the only difference between them.
#     - IDENTITY keeps 7001-7010: repeat r under blocks.identity[r].
#     - EVAL gets a DISJOINT block, 7011-7015, so no eval clip shares an initial latent with any
#       training clip in EITHER arm.
#   Nothing else moved IN THIS AMENDMENT: no style was added, dropped, re-slugged or moved between
#   the sets, no prompt was reworded, and every clip total is what it was — 4 020 / 4 020 / 2 010.
#   The seed schedule is the whole of it.
#
#   BUT THE DIGEST DID NOT MOVE FOR THE SCHEDULE ALONE, because a third amendment landed the same
#   day and the V3 author needs both accounted for: train-04's lighting slug and prompt were
#   reworded ("low-key-desk-lamp" -> "moody-dim-desk-lamp") when the geometry lint took the stem
#   "low", which is recorded at the style itself. Two independent content changes, one digest. Read
#   the sidecar, never a value quoted in prose.
#
# The next amendment, if there is one, is very likely a V2: the moment a clip exists this comment
# stops applying.
rule = "T40_STYLES_V1"
committed = "2026-08-15"
pre_registration = "docs/preregistration/PR-08-photoreal-augmentation.md"
# The V2 clarification this file's [volume] block implements: arm C frame-matched to arm B at
# 10 x 402, and the GPU-h ceiling derived over the whole 10 050-clip partition.
#
# ONE DISAGREEMENT WITH IT, RECORDED RATHER THAN PAPERED OVER, AND IT IS ABOUT THIS FILE'S HASH.
# PR-08-V2 §0 and §5 both state that the committed partition is "unchanged" and that its
# source_content_sha256 is still 4da3875d0c76e9b23821c1ca9fe20f965f9fc0867edcd085fb792b587a680da8,
# reasoning that the ten seeds are "a generation parameter, not a new style". That reasoning is
# sound about STYLES and wrong about this FILE, for two reasons that both post-date it:
#   1. the seeds and the repeat counts were put HERE, in the committed partition and its rendering,
#      rather than left as a submit-time parameter — precisely so the sbatch's work-list expansion
#      reads them instead of inferring them, and so a run cannot be generated under seeds nobody
#      wrote down. V2 §2 itself requires the ten seed values to be recorded; this is where.
#   2. eval-01's prompt was reworded (see the style) after the geometry lint grew a
#      spatial-relation vocabulary — a prompt string change, which V2 §0 says V2 does not make,
#      and it did not: the lint did.
#   3. and now the seed SCHEDULE as well as the seed values (see the second amendment above and
#      [seed_schedule]). V2 §2 requires the ten seed values to be recorded and this is where they
#      are, but it says nothing about which style-instance draws which one — and the answer that
#      fell out of the V1 rule put every arm-B training clip and every eval clip on one shared
#      seed. The assignment is therefore committed here too, and it is part of the hash.
# So the recorded digest MOVED, and V2's two citations of 4da3875d... are stale. That is a defect
# in a registered document and it is not repairable from here: rules are versioned, never edited in
# place (docs/handoff.md §3). It needs a V3 recording the new value — and the V3 that records it
# should also register the seed-schedule rule in §2, because "ten committed seeds" is satisfied by
# a schedule that hands arm B one of them and hands the eval set the same one. Until then, the
# authority for the partition hash is this file's sidecar, which check_style_partition.py
# recomputes on every run — not V2's §0 table.
pre_registration_v2 = "docs/preregistration/PR-08-V2-arm-c-frame-matching.md"
rule_v2 = "T40_RULE_V2"
task = "T-040"
generator = "Cosmos-Transfer2.5, frozen"

# The prompt is prose, and that is a decision rather than an observation. PR-08 §5 says arm C's
# "style prompt *is* the source's own appearance", which is a prompt-shaped thing; but
# Cosmos-Transfer2.5's prompt contract is not vendored in this repo (no cookbook, no config, no
# script — docs/backbone-eval.md §5 describes it in prose only). The only prompt machinery here,
# scripts/make_t041_eval_prompts.py and scripts/make_apple_variation_prompts.py, emits an 18-key
# structured caption for Cosmos3-**Super** text2video, which is a different model and a different
# API. So the partition is committed at the level that survives either answer: the *identity* of a
# style (its id and its four axis slugs) and the appearance it names. If Transfer2.5 turns out to
# consume a structured caption instead, the prompt strings below are what goes into the
# appearance-bearing keys (`background_setting`, `lighting.*`, `aesthetics.color_scheme`, the
# apple subject's `description`) via the apply_variation() override discipline that already
# exists — and the partition is unchanged, because the partition is the ids and the slugs.
# Whichever shape is used, record it in the verdict.
prompt_form = "prose"

# ---------------------------------------------------------------------------------------------
# What may vary, and what may not. T-040: "Appearance may vary; geometry may not. The actions are
# the recorded trajectory, so anything that moves an object desynchronizes pixels from labels and
# the arm grasps empty air."
#
#   ALLOWED   apple texture / colour / variety, table (tablecloth) material, background / wall,
#             lighting
#   FORBIDDEN apple or plate *position*, table height, robot pose, object count
#
# Two consequences that are easy to miss and are therefore written into every prompt below:
#
#  1. THE PLATE IS NOT AN AXIS. It is not in T-040's allowed list, and the one existing script
#     that varies it (make_apple_variation_prompts.py's `white-bowl`) changes receptacle geometry,
#     which is the thing G0b exists to catch. Every prompt ends by holding the plate fixed.
#  2. Every prompt ends with the invariance clause as well, so the constraint is in the text the
#     generator actually reads and not only in this comment.
# ---------------------------------------------------------------------------------------------
allowed_axes = ["apple", "table", "background", "lighting"]
invariance_clause = "The white plate keeps its own appearance. Scene geometry, camera framing and the robot are unchanged."

[source]
# The corpus being restyled (PR-08 §3: re-derived from the HF source at full resolution, NOT
# datasets/gr00t-apple-full/, which is 120x160).
corpus = "nvidia/GR00T-N1.7-AppleToPlate"
episodes = 402
# Where the identity style's text comes from, verbatim. This is a *caption of the same scene* from
# the T-041 corpus — the only machine-written description of AppleToPlate's appearance we hold —
# not a hand-written summary of it, for the same reason make_apple_variation_prompts.py edits a
# real caption instead of authoring one: a hand-written description differs in style as well as in
# content, and arm C's whole job is to differ in nothing.
caption_provenance = "~/wam-t041/cosmos-g1-embodiment/val/captions/gr00t-n1-7-appletoplate_episode_000135_clip000/caption.json"

# =============================================================================================
# VOLUME — the clip arithmetic, machine-readable, so nobody recomputes 10 x 402 by hand and
# nobody has to infer arm C's size from the fact that there is one identity style.
#
# THE THING THIS TABLE EXISTS TO PREVENT. PR-08 §5 gives arm C `real+identity` as the
# generator-fingerprint control: "Same generator, same pipeline, SAME FRAME COUNT, no added
# diversity." Frame count is not decoration in that sentence — it is the whole mechanism. Arm B
# differs from arm A in two things at once, appearance diversity and generated volume, and arm C
# is the arm that holds volume fixed while removing the diversity. An arm C at 402 clips against
# an arm B at 4020 removes the diversity AND removes 90% of the volume, so B > C would be
# consistent with "diversity helped" and equally consistent with "more data helped", and the
# headline could not tell them apart. That is the control failing open.
#
# THE FIX, and the one that was rejected. Two ways to frame-match: subsample arm B to 402, or
# repeat the identity style to 4020. Subsampling B was rejected — B is the arm the experiment is
# about, PR-08 §9 prices it at ten restyles of 402 demos, and cutting it to a tenth to make a
# control fit would answer a smaller question than the one registered. So the identity style is
# generated TEN TIMES PER EPISODE, under ten distinct committed seeds, and arm C lands on the same
# 4020 clips as arm B. Ten repeats of one appearance is exactly what a fingerprint control should
# be: the generator's own variance under a fixed prompt, sampled as many times as arm B samples
# its ten prompts.
#
# THE CONSEQUENCE, WHICH IS NOT FREE. Generated volume across the partition roughly doubles
# (train 4020 + identity 4020, plus eval). The GPU-h ceiling of PR-08 §8 item 3 must therefore be
# derived over the WHOLE partition and then split across the three STYLE_SET invocations — see
# gpu_h_ceiling_scope below and the [consumer] note, because the sbatch's gate is per-invocation
# and will happily approve the same ceiling three times.
# =============================================================================================
[volume]
episodes = 402

# Arm B / arm D. Ten styles, one clip each per episode.
train_style_count = 10
train_repeats = 1
train_clips = 4020

# Arm C. One style, ten clips each per episode. train_clips == identity_clips is the invariant
# PR-08 §5 asks for, and scripts/check_style_partition.py fails if it stops holding.
identity_style_count = 1
identity_repeats = 10
identity_clips = 4020

# EVAL_STYLES, over all 402 episodes. This total is NOT this file's to choose — T40_RULE_V2 §3.1
# fixes it at "5 x 402 = 2 010 clips (unchanged)" and derives the ceiling over a whole partition of
# 10 050, and the sbatch's work-list expansion already strides over every episode in the manifest
# rather than over an eval subset. An earlier draft of this table committed only the per-episode
# rate on the argument that the held-out episode split belongs to the episode partition; that is a
# defensible position and it is not the registered one, and a config that quietly disagrees with
# the rule it implements is worse than one that is wrong out loud.
eval_style_count = 5
eval_repeats = 1
eval_clips_per_episode = 5
eval_clips = 2010

# The two totals T40_RULE_V2 §3 names, kept apart because they answer different questions.
#   training_clips        arm B + arm C, i.e. the generated frames that reach a training corpus.
#                         "roughly doubles, to ~8 040 clips" (§3.1) — up from 4 422 under the
#                         unmatched arm C.
#   whole_partition_clips train + eval + identity. THIS is the ceiling basis: §3.2 requires the
#                         GPU-h ceiling to be derived "over 10 050 clips, i.e. over all 25
#                         style-instances", never per style-set invocation.
training_clips = 8040
whole_partition_clips = 10050
# 10 train + 10 identity + 5 eval. The unit §3.1 prices at ~171 625 frames each (~4.29 M total).
style_instances = 25

# THE SEEDS MOVED OUT OF THIS BLOCK on 2026-08-15 (second amendment, see the header) and they are
# now in [seed_schedule], with the ASSIGNMENT next to them. `repeat_seeds` used to live here as a
# bare list of ten values under the rule "repeat r uses repeat_seeds[r]; repeats = 1 uses
# repeat_seeds[0]", and since every TRAIN and every EVAL style has repeats = 1, that rule put all
# 4 020 arm-B clips and all 2 010 eval clips on seed 7001 while arm C alone spanned all ten. The
# values were never the load-bearing part; the schedule was, and a list of values does not carry a
# schedule. [seed_schedule] carries both and is inside the partition hash.
seed_schedule_ref = "seed_schedule"

# Read by nothing; stated so a reviewer can check the claim above in one line.
frame_matched_arms = ["train", "identity"]

# T40_RULE_V2 §3.2: the ceiling is derived over the whole partition and then SPLIT across the
# STYLE_SET invocations, because the sbatch enforces CEILING_GPU_H per invocation and would
# otherwise authorise the same number three times. See [consumer] item 3.
gpu_h_ceiling_scope = "whole-partition"
gpu_h_ceiling_basis_clips = 10050

# =============================================================================================
# SEED SCHEDULE — which style-instance is generated under which initial-noise seed.
#
# THE SCHEDULE IS THE COMMITMENT, NOT THE SEED VALUES. The values are arbitrary; the assignment is
# not, and the previous version of this file committed only the values. Under its rule ("repeat r
# uses repeat_seeds[r]; repeats = 1 uses repeat_seeds[0]") every TRAIN style and every EVAL style —
# all of which have repeats = 1 — resolved to repeat_seeds[0] = 7001. Arm B was 4 020 clips at one
# seed, the eval set was 2 010 clips at THE SAME seed, and arm C was the only arm that saw ten.
#
# WHY THAT IS FATAL RATHER THAN UNTIDY. Two separate defects:
#
#  1. B AND C DIFFERED IN TWO THINGS. Arm B varied the prompt at a fixed seed; arm C varied the
#     seed at a fixed prompt. B − C was then "ten prompts at one seed" minus "one prompt at ten
#     seeds", i.e. a difference between two effects, not the isolation of one. PR-08 §5 asks arm C
#     to differ from arm B in diversity and in nothing else.
#
#  2. THE TRAINING SET SHARED A SEED WITH THE EVAL SET, IN ONE ARM ONLY. The headline is scored on
#     EVAL_STYLES clips, which were also all at 7001. So every one of arm B's training clips shared
#     its initial latent with every eval clip, while nine tenths of arm C's did not. If the
#     generator leaves any transferable seed-specific fingerprint at all — and arm C exists
#     precisely because we do not assume it does not — then B's training distribution is matched to
#     the scoring distribution more closely than C's for a reason unrelated to appearance
#     diversity, and B − C is inflated on the headline. A confound that can manufacture a p, in the
#     control that was added to remove exactly this class of confound.
#
# THE FIX, AT ZERO EXTRA CLIPS, AND ONLY AVAILABLE BEFORE THE FIRST CLIP EXISTS. One seed per
# style-instance, one block per set: TRAIN and IDENTITY share an identical block (so the two arms
# span the same seeds and diversity is all that is left between them), and EVAL gets a block
# disjoint from both (so no eval clip shares an initial latent with any training clip in EITHER
# arm). No style, prompt, slug or clip count changes.
#
# THE ARITHMETIC, WORKED THROUGH RATHER THAN ASSERTED — the "style i uses blocks.train[i]" rule
# only spans ten seeds for arm B because arm B has ten styles, so it is written out:
#
#   set        styles x repeats = instances/episode   seed_index = style_index*repeats + repeat
#   ---------  --------------------------------------  ----------------------------------------
#   train      10 x  1 = 10                            i*1 + 0 = i        for i in 0..9  -> ten
#   identity    1 x 10 = 10                            0*10 + r = r       for r in 0..9  -> ten
#   eval        5 x  1 =  5                             j*1 + 0 = j       for j in 0..4  -> five
#
#   train    10 instances x 402 episodes = 4 020 clips over blocks.train    (7001-7010)
#   identity 10 instances x 402 episodes = 4 020 clips over blocks.identity (7001-7010)
#   eval      5 instances x 402 episodes = 2 010 clips over blocks.eval     (7011-7015)
#
# So arm B and arm C do not merely span the same SET of seeds — they use each of the ten the same
# number of times, 4 020 / 10 = 402 clips per seed in both arms, one per episode. The match is
# seed-by-seed, which is the strong form of the property and it falls straight out of
# train_instances == identity_instances, i.e. out of the frame match [volume] already enforces.
# The eval block is 402 clips per seed on five seeds none of which any training clip touches.
#
# The blocks are the same for every episode, deliberately: the seed is a property of the
# style-instance, not of the episode, so "episode 000135 at 7003" identifies a clip and a resume
# under a different schedule is detectable (the sbatch hashes the seed into WORK_SHA).
# =============================================================================================
[seed_schedule]
# NORMATIVE AND MACHINE-READABLE. `assignment` is the name the checker and the sbatch dispatch on;
# `rule` is the same statement in one line for a human recomputing a seed by hand. They are
# checked against the code (scripts/check_style_partition.py), because the last seed rule was a
# sentence in a comment and a sentence in a comment is what produced the defect above.
assignment = "style-instance-index"
rule = "seed = blocks[<set>][style_index * repeats + repeat_index]; style_index and repeat_index are 0-based, styles in committed order"
# Every style-instance in a set gets its own seed and no seed is committed that no instance uses:
# len(blocks[set]) == style_count[set] * repeats[set], enforced. A block longer than the set is a
# seed nobody generates under, which is how a schedule quietly stops being the one that ran.
one_seed_per_style_instance = true

[seed_schedule.blocks]
# Arm B. Ten styles x one repeat, so style i is generated under train[i] and the arm spans all ten.
train = [7001, 7002, 7003, 7004, 7005, 7006, 7007, 7008, 7009, 7010]
# Arm C. One style x ten repeats, so repeat r is generated under identity[r] and the arm spans the
# same ten. IDENTICAL TO `train` BY RULE, not by coincidence: check_style_partition.py fails if the
# two blocks stop being the same set, because the moment they differ, part of B − C is the seeds.
identity = [7001, 7002, 7003, 7004, 7005, 7006, 7007, 7008, 7009, 7010]
# The headline's scoring set. DISJOINT FROM BOTH TRAINING BLOCKS, and the checker fails on any
# intersection. An eval clip that shares its initial latent with a training clip hands whichever
# arm generated that training clip a match to the scoring distribution that is not diversity.
eval = [7011, 7012, 7013, 7014, 7015]

# =============================================================================================
# BLOCKING TODOs — open items that must close BEFORE generation, as records rather than as prose.
#
# Each is a thing that would make a finished run uninterpretable rather than merely imperfect, so
# it blocks the submission and not the review. scripts/check_style_partition.py prints every OPEN
# item on every run; it does not fail on them, because committing this file is explicitly allowed
# (PR-08 §1) while generating from it is not, and a checker that refused to pass would only teach
# people to skip the checker.
# =============================================================================================
[[blocking_todos]]
id = "T40-TODO-01-identity-prompt-provenance"
status = "CLOSED"
blocks = "STYLE_SET=identity  (arm C, the generator-fingerprint control)"
rule_ref = "PR-08 §5 — arm C's style prompt *is* the source's own appearance"
claim = """[identity_style].prompt is assembled from a T-041 machine caption of ONE clip,
episode_000135_clip000 (see [source].caption_provenance), and is applied unchanged to all 402
episodes. Nobody has checked that it describes the other 401, and it was written against T-041's
corpus rather than against the 640x480 re-derivation PR-08 §3 restyles."""
why_blocking = """Arm C is a control, and a control is only a control if its prompt is the
source's own appearance. If the caption is wrong for most episodes — a different cloth, a
different apple, different lighting — then arm C is a weak RESTYLE, not an identity pass. It would
then carry some of arm B's diversity, B - C would understate the diversity effect, and the
headline's attribution between 'diversity helped' and 'generator fingerprint' silently breaks. The
frame-match fixed by [volume] does not help here: a frame-matched control with the wrong prompt is
still the wrong control."""
action = """Re-derive the identity prompt from the 640x480 corpus, or sample-check the committed
one against a random sample of episodes spanning the corpus and record the sample, the sample size
and the disagreements. If the appearance is not constant across the 402, that is the finding and
arm C needs a per-episode identity prompt rather than one shared string."""
evidence_required = "the sampled episode ids, the sample size, and the per-episode verdicts"
resolution = """CLOSED 2026-08-22. The suspicion was right and the diagnosis was wrong: the
caption is not a bad generalisation from episode_000135, it is wrong about episode_000135. A census
of ALL 402 episodes measured per-episode mean cloth RGB spanning (66.1, 65.9, 65.0) to
(86.4, 86.5, 85.8) -- L* 28.0-36.7, largest in-episode R/G/B spread 3.07 counts, i.e. neutral grey.
Black cloth sits near L* 5. Not one of the 402 is close, and episode_000135 itself is
(88.2, 87.9, 89.0).

The `action` field's either/or was answered both ways. Sample-check: judged blind by a calibrated
instrument, the committed wording drew match 0 / mismatch 40, every row naming the cloth. Re-derive:
the census then fixed the two words, and the corrected wording drew match 40 / mismatch 0 on the
SAME forty frames with DISJOINT judges in the same session, so this is not judges getting friendlier.

`action` also asked what to do if the appearance is not constant across the 402 -- arm C would need a
per-episode prompt rather than one shared string. It is constant on every axis the prompt names:
cloth in a narrow neutral band, warm apple mask present 402/402 with zero green pixels in any
episode, bright plate region present 402/402, frame median luminance 79.6-95.0 corpus-wide. ONE
SHARED STRING IS THEREFORE CORRECT, and no per-episode prompt is needed.

The one genuinely inconstant feature was measured and deliberately EXCLUDED: a pale strip of the
surface behind the cloth is a full-width band in 370/402 episodes and ABSENT IN 32 (contiguous
recording runs where the camera sat lower), 3.7% of frame height at the median. Naming it would tell
an image-conditioned generator to synthesise a surface that is not there in 8% of the corpus -- the
same class of error being corrected here, in the other direction.

KNOWN AND NOT CLOSED BY THIS. (1) `and a visible stem` is a fourth false specific: the apple is
rotated so no stalk faces the camera in roughly a quarter of frames. The calibrated protocol did NOT
reproduce it as a mismatch -- all 40 rows matched, one judge noting "stem turned away from the
camera" and matching anyway -- so it was left alone rather than edited on an uncalibrated pass.
(2) Passing the instrument's calibration is necessary and never sufficient: its items are
manufactured and these forty are natural frames. (3) Every observer in the chain is a model, which
is a correlated observer to the instrument it judges. Full argument and the raw numbers:
