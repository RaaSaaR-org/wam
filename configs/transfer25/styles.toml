# =============================================================================================
# EVAL_STYLES — 5. The headline's visually shifted eval set (PR-08 §6). No arm trains on these.
#
# DISJOINTNESS IS CHECKED ON THE AXIS SLUGS, NOT ON THE IDS, and that is the point of having
# slugs at all. Two styles with different ids can still be the same appearance — "walnut-veneer"
# in TRAIN and "oak-veneer" in EVAL would pass any id-level check while making the eval set a
# near-copy of the training domain, and the headline would then report generalisation to a shift
# that did not happen. So: for each of the four axes, the set of slugs used in TRAIN, the set used
# in EVAL, and the identity style's slug are pairwise disjoint, and the verifier enforces it.
#
# Five and not ten: EVAL_STYLES are only generated for the eval episodes, and PR-08 §7 already
# records that a P here is a claim about held-out *generated* appearance rather than real
# appearance — so buying breadth on the eval side buys less than it looks like it does. The number
# is fixed here, before any clip, which is the property that matters.
#
# `repeats = 1` here too, and for a different reason than TRAIN_STYLES': the eval set is what arms
# A and B are SCORED on, not trained on. Repeating an eval style would weight one appearance five
# times over in the headline mean without adding a held-out appearance, which changes what the
# number means for no gain. Arm C's frame match is a property of the training corpora and does not
# reach this set. [volume] commits the total as 5 x 402 = 2 010, which is T40_RULE_V2 §3.1's
# figure and matches what the sbatch's expansion actually does (it strides over every episode in
# the manifest, not over an eval subset).
#
# THE EVAL SEEDS ARE A DISJOINT BLOCK, 7011-7015, and that is a property of the HEADLINE rather
# than of these styles. The eval set is what B − A and B − C are read off. If an eval clip is
# generated from the same initial latent as a training clip, then whichever arm owns that training
# clip is matched to the scoring distribution by the generator's own seed-specific behaviour and
# not by anything the experiment is about. Under the previous schedule that is exactly what
# happened, and it happened to ONE arm: every eval clip and every arm-B training clip sat on 7001
# while nine tenths of arm C's did not, which biases the B − C the control exists to produce.
# Style j here is generated under [seed_schedule.blocks].eval[j]; check_style_partition.py fails
# if that block ever intersects either training block.
# =============================================================================================
[[eval_styles]]
id = "eval-01-terracotta-rim"
repeats = 1
apple = "lime-green-smooth"
table = "terracotta-tile"
background = "lavender-wall"
lighting = "strong-side-rim"
# REWORDED 2026-08-15, "from the left" -> "from one side", and the reword is the point rather than
# a tidy-up. The geometry lint gained a spatial-relation vocabulary after a reviewer showed that
# "The apple sits to the left of the plate." passed it clean, and "left" then matched here. The
# word was innocent in this sentence — it described the LIGHTING direction, which is on T-040's
# allowed side — but the lint cannot tell a lit-from-the-left wall from a moved-to-the-left apple,
# and it is not supposed to try: scripts/check_style_partition.py's own rule is that a false
# positive costs one edit to a file nobody has generated from yet, while a false negative costs a
# corpus. So the STYLE was fixed and the TERM was kept. The appearance is unchanged — the slug is
# still `strong-side-rim`, the light is still a hard side rim with dark falloff, and only the
# compass word is gone. The alternative, exempting "left" when it follows "light from the", is
# exactly the shape a real violation would take.
prompt = "A smooth lime green apple on a terracotta tiled surface, against a lavender painted wall, lit by a strong rim light from one side with dark falloff. The white plate keeps its own appearance. Scene geometry, camera framing and the robot are unchanged."

