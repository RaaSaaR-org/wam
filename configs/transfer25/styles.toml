lighting = "cold-blue-dusk"
prompt = "A very dark purple-black Arkansas Black apple on a green baize cloth, against a rusted corrugated metal wall, lit by cold blue dusk light, dim and bluish. The white plate keeps its own appearance. Scene geometry, camera framing and the robot are unchanged."

