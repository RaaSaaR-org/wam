[hash]
# THE STYLE PARTITION HASH — the value PR-08 §6 lists under "Recorded regardless of verdict".
#
# It is a hash of the *content*, not of the file's bytes: sha256 over the canonical JSON of this
# document with the [hash] and [consumer] tables removed, `json.dumps(..., ensure_ascii=True,
# sort_keys=True, separators=(",", ":"))` — the same serialisation make_t041_eval_prompts.py uses,
# for the same reason (whitespace is not the object). So rewording a comment does not invalidate a
# finished run's recorded hash, while changing any style, any slug, any id, or the rule name does.
#
# [consumer] is outside the hash too, and that exclusion is argued rather than convenient: it holds
# a path and two key names, the question the recorded hash has to answer is "which styles was this
# generated under", and repointing the generator at a different copy of the same rendering must not
# make a finished run's recorded value unmatchable. It cannot hide a style change either — the
# rendering is checked against this document on every run of the verifier.
#
# The value lives in the sidecar styles.toml.sha256 rather than in this file, because a file
# cannot contain its own hash. scripts/check_style_partition.py recomputes it and FAILS if the
# sidecar disagrees; `--write-hash` is the only thing that writes the sidecar.
#
# THE RULE STRING BELOW IS NORMATIVE AND WAS WRONG UNTIL 2026-08-15. It read
# "sha256(canonical_json(document minus [hash]))" and omitted [consumer], while the code's
# HASH_EXCLUDES has always been ("hash", "consumer"). Anyone recomputing the PR-08 §6 partition
# hash from the rule string as written got a digest that could never match the committed one, and
# the natural reading of that mismatch — "the partition changed" — is the exact alarm this value
# exists to raise. A rule string that cannot reproduce its own digest is worse than no rule
# string. It now names both exclusions, and the prose two paragraphs up already argued [consumer].
rule = "sha256(canonical_json(document minus [hash] and [consumer]))"
excludes = ["hash", "consumer"]
sidecar = "configs/transfer25/styles.toml.sha256"

[consumer]
# cluster/discoverer/97_transfer25_restyle.sbatch reads the partition with json.loads and indexes
# styles["train"] / styles["eval"], and it byte-hashes the file it is given with sha256sum. So the
# generator does not read this file; it reads a *rendering* of it, generated by
# `scripts/check_style_partition.py --emit-json` and committed alongside. THIS FILE REMAINS THE
# SOURCE OF TRUTH — the rendering carries no argument for any value and must never be hand-edited.
# The verifier refuses to pass when the two disagree, which is the only reason committing both is
# safe.
#
# RECONCILIATION, re-checked against the sbatch on 2026-08-15. The two items that used to stand
# here were STALE IN BOTH DIRECTIONS and would have sent a reader to "fix" a correct script:
#   - it said STYLE_PARTITION defaults to configs/cosmos3/pr08_style_partition.json. It does not,
#     and may never have: line 221 is
#       STYLE_PARTITION=${STYLE_PARTITION:-${WAM}/configs/transfer25/pr08_style_partition.json}
#     which is this rendering, at this path. Nothing to point anywhere. RESOLVED, no action.
#   - it said that for STYLE_SET=identity the sbatch substitutes {"id": "identity", "prompt":
#     None}. It explicitly REFUSES to: the work-list block reads the committed 'identity' set like
#     any other and exits FATAL if the rendering has no such set, with a comment recording that an
#     earlier draft did synthesise one and that doing so "would make the control unattributable".
#     Arm C is prompted from [identity_style].prompt below. RESOLVED, no action.
# Following that note as written would have meant editing a correct default to a wrong path and
# re-introducing a synthesised identity prompt into the one arm whose prompt must not be invented.
#
# WHAT IS ACTUALLY OPEN, verified against the script rather than remembered (re-checked
# 2026-08-15, after the seed-schedule amendment):
#   1. REPEATS ARE EXPANDED. RESOLVED, no action. The work-list block loops
#      `for r in range(repeats_of(s))`, emits unit ids `<episode>__<style>__r<NN>`, exits FATAL on
#      a style with no positive integer `repeats` (no default of 1), and re-proves arm C's frame
#      match against the expansion itself. The note that used to stand here described a script
#      that no longer exists.
#   2. THE FRAME COUNT FEEDING THE CEILING GATE INHERITED (1), so it is resolved with it: the
#      expansion prices the WHOLE partition (every set, times its repeats, times every episode)
#      and hands that to the gate alongside this chunk's frames.
#   2b. SEEDS ARE READ PER STYLE-INSTANCE, not per repeat index. RESOLVED in the same amendment
#      that added [seed_schedule]: the rendering carries a resolved `seeds` list on every style
#      (one entry per repeat, in repeat order) and the expansion uses `seeds_of(s)[r]`. It must
#      NOT go back to indexing one shared list by r — that rule is what put all of arm B and all
#      of the eval set on seed 7001. The sbatch re-checks the two schedule invariants (train and
#      identity span the same seed set; eval is disjoint from both) before it writes a work list,
#      because it is the last gate before a clip exists.
#   3. THE CEILING IS PER-INVOCATION AND THE BUDGET IS NOT. The gate compares CEILING_GPU_H
#      against THIS invocation's projection, so passing one whole-partition ceiling to each of
#      STYLE_SET=train, eval and identity authorises it three times over. PR-08 §8 item 3's
#      ceiling is derived over the whole partition (volume.gpu_h_ceiling_scope): derive it once
#      over train + eval + identity, split it across the three submissions in proportion to their
#      clip counts, and pass each submission only its share. Record the split with the derivation.
rendering = "configs/transfer25/pr08_style_partition.json"
rendering_keys = ["train", "eval", "identity"]
# Also emitted into the rendering, for the expansion described in items 1 and 2b above. `seeds` is
# the schedule already RESOLVED per style — seeds[r] is the seed for repeat r of that style — so
# the consumer never re-derives an index rule and cannot re-derive a different one.
rendering_style_keys = ["id", "prompt", "apple", "table", "background", "lighting", "repeats",
                        "seeds"]
rendering_volume_key = "volume"
rendering_seed_schedule_key = "seed_schedule"

# =============================================================================================
# IDENTITY — arm C's control. IN NEITHER SET, BY CONSTRUCTION.
#
# PR-08 §5 arm C `real+identity`: "restyles whose style prompt *is* the source's own appearance …
# generator-fingerprint control. Same generator, same pipeline, same frame count, no added
# diversity." It is not a style: it adds no appearance the corpus does not already have. Putting
# it in TRAIN_STYLES would smuggle arm C's frames into arm B; putting it in EVAL_STYLES would make
# the headline's "visually shifted" eval set unshifted, and §6's B−A could then be read off a
# domain that never moved. The verifier asserts it is in neither, on id and on all four slugs.
# =============================================================================================
[identity_style]
id = "identity-source"
role = "control"
arm = "C"
# TEN clips per episode, not one — see [volume]. This is the field the sbatch's work-list
# expansion must read (its item 1 in [consumer]); it is not a hint and it is not derivable from
# anything else in the file. 10 x 402 = 4020 = train_clips, which is PR-08 §5's "same frame
# count". If this ever stops equalling the number of TRAIN_STYLES, arm C stops being frame-matched
# to arm B and check_style_partition.py fails rather than letting the run be submitted.
repeats = 10
# Repeat r is generated under [seed_schedule.blocks].identity[r], so arm C spans 7001-7010 — the
# same ten seeds arm B spans across its ten styles, 402 clips per seed in each arm. That equality
# is the point: with the seeds held identical, the ONLY thing left differing between arm B and arm
# C is prompt diversity, which is what B − C is supposed to measure.
apple = "source-red-yellow-glossy"
table = "source-dark-grey-cloth"
background = "source-dark-grey-flat"
lighting = "source-even-bright-top-down"
prompt = "A red and yellow apple with a glossy surface and a visible stem, on a dark grey cloth covering a flat surface. A white, round plate. Even, bright, top-down lighting with minimal shadows; the lighting highlights the objects without creating harsh contrasts. Contrast between the dark grey background and the white plate and red/yellow apple. Live-action video, realistic. The white plate keeps its own appearance. Scene geometry, camera framing and the robot are unchanged."

# The caption fields the prompt above WAS assembled from, quoted as the PROVENANCE RECORD of what
# T-041's captioner produced for episode_000135_clip000 — and, since 2026-08-22, no longer an
# assembly the prompt can be checked against.
#
# THE CAPTION IS WRONG ABOUT ITS OWN CLIP, AND THE PROMPT HAS BEEN CORRECTED AWAY FROM IT.
# A census of all 402 episodes (docs/t040-identity-prompt-correction.md) measured per-episode mean
# cloth RGB spanning (66.1, 65.9, 65.0) to (86.4, 86.5, 85.8) — L* 28.0-36.7, largest in-episode
# R/G/B spread 3.07 counts, i.e. neutral grey. Black cloth would sit near L* 5. Not one of the 402
# is close, and episode_000135 ITSELF is (88.2, 87.9, 89.0). Judged blind by the calibrated
# instrument, the old wording drew match 0 / mismatch 40 and the corrected wording drew
# match 40 / mismatch 0 on the SAME forty frames with disjoint judges.
#
# LEAVE THESE QUOTES AS THEY ARE. They record what the captioner said, which is what
# [source].caption_provenance points at; editing them would destroy the evidence that the caption
# and the corpus disagree. What is no longer true is that `prompt` is their concatenation.
#
# NOTE FOR check_style_partition.py's FORBIDDEN_TERMS: its comment excludes the stem "between"
# solely because this prompt was a verbatim caption quote. It is not one any more — but "between"
# is still not added, because the corrected prompt carries "Contrast between" and adding the term
# would reject it. The exemption now rests on a different argument: the clause is pinned by
# check_structure, and the demonstrated bypass it guarded against is caught twice over.
[identity_style.source_caption]
"subjects[0].description" = "A red and yellow apple with a glossy surface and a visible stem."
"subjects[2].description" = "A white, round plate."
background_setting = "A black cloth covering a flat surface."
"lighting.conditions" = "Even, bright lighting."
"lighting.direction" = "Top-down lighting."
"lighting.shadows" = "Minimal shadows."
"lighting.illumination_effect" = "The lighting highlights the objects without creating harsh contrasts."
"aesthetics.color_scheme" = "Contrast between the black background and the white plate and red/yellow apple."
style_medium = "Live-action video."
artistic_style = "Realistic."

# =============================================================================================
# TRAIN_STYLES — 10. Arms B and D train on restyles drawn from here.
#
# Ten because PR-08 §9 prices the experiment as "ten restyles of 402 demos", and §8 item 3 makes
# the GPU-h ceiling a multiple of the variant count (~172 000 frames per variant). A count chosen
# after the throughput measurement would be a budget decision dressed as a design decision.
#
# Each style names all four allowed axes and nothing else. The axis values are *slugs*, and the
# slugs are what disjointness is checked on — see EVAL_STYLES below for why the check is not on
# the ids.
#
# `repeats = 1` on every one of them, stated rather than defaulted. Arm B's diversity comes from
# having ten appearances, not from sampling one of them ten times, so a repeat here would add
# generator variance to the arm that is supposed to isolate diversity — the mirror image of arm
# C's job. It is written out on each style because the sbatch's expansion reads the field and an
# absent field is a thing to infer; ten explicit ones cost a line each and infer nothing. This is
# also the half of the frame-match that must NOT move: PR-08 §9 prices arm B at ten restyles of
# 402 demos, and matching arm C by cutting B to 402 would answer a smaller question than the one
# registered. C was raised to B, never the reverse.
#
# ONE SEED PER STYLE, AND THE ORDER BELOW IS THE SCHEDULE. Style i is generated under
# [seed_schedule.blocks].train[i], so the ten styles listed here span 7001-7010 — the same ten arm
# C spans over its ten repeats, 402 clips per seed in both arms. `repeats = 1` is why the seed has
# to come from the STYLE index and not from the repeat index: under the old rule (repeats = 1 uses
# seed[0]) all ten of these, and therefore all 4 020 arm-B clips, were one seed. Reordering the
# styles below re-assigns the seeds, which is a content change and moves the partition hash — that
# is intended, and it is why the rule says "styles in committed order".
# =============================================================================================
