    <text x="404" y="105" class="disp" font-size="12.5" fill="#F5F5F4">WAM policy</text>
    <text x="404" y="130" class="sans" font-size="10" fill="#A8A29E">state + vision in</text>
    <text x="404" y="152" class="sans" font-size="10" fill="#78716C">one pass -&gt; one chunk</text>
    <text x="79" y="240" class="sans" font-size="10" letter-spacing="0.3" fill="#2DD4BF">ONE CHUNK &#8212; 16 STEPS, dt_s APART</text>
    <text x="650" y="272" text-anchor="end" class="sans" font-size="9" letter-spacing="0.27" fill="#FF8534">SAFETY LIMIT</text>
    <text x="79" y="342" class="sans" font-size="10" letter-spacing="0.3" fill="#FF8534">EXECUTED PREFIX</text>
    <text x="581" y="342" text-anchor="end" class="sans" font-size="10" letter-spacing="0.3" fill="#78716C">DISCARDED AT THE NEXT RE-PLAN</text>
    <text x="330" y="376" text-anchor="middle" class="sans" font-size="10" letter-spacing="0.3" fill="#78716C">RE-PLAN</text>
    <text x="330" y="38" text-anchor="middle" class="sans" font-size="12.5" letter-spacing="0.375" fill="#2DD4BF">RECEDING HORIZON</text>
    <text x="330" y="68" text-anchor="middle" class="disp" font-size="18" fill="#F5F5F4">Plan a whole chunk. Execute the first steps.</text>
    <text x="330" y="434" text-anchor="middle" class="sans" font-size="15" letter-spacing="0.45" fill="#F5F5F4">Only the prefix runs &#8212; the tail is discarded, not queued.</text>
