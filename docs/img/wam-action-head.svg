<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="The WAM action head takes one pooled backbone feature vector, runs it through a small MLP trunk and splits into two bounded heads: a tanh target head emitting 8 to 32 per-step joint deltas and a sigmoid gripper head emitting a 0 to 1 command per step. Together they form one action chunk, of which the closed loop executes only the first few steps. The bounded tanh output is already in radians — no denormalization step exists anywhere.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.72">
      <stop offset="0" stop-color="#FF6700" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF6700" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
    <pattern id="tape" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="13" height="26" fill="#FF6700"/>
      <rect x="13" width="13" height="26" fill="#0A0A0A"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#FF6700" stroke-width="1.4"/>
    </marker>
    <style>
      .disp { font-family: 'Space Grotesk','Helvetica Neue',Arial,sans-serif; font-weight:700; letter-spacing:-0.5px; }
      .sans { font-family: 'Geist','Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'Geist Mono',ui-monospace,Menlo,monospace; }
      .flow { stroke:#FF6700; stroke-width:3; opacity:0.45; fill:none; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>

  <g opacity="0.08" transform="translate(1008,240) scale(1.54074) translate(-603.84613,-386.53845) translate(-3.8461304,13.461548)">
    <path d="m 603.84613,761.53845 a 15,15 0 0 0 0,-30 30,30 0 0 1 0,-60 45,45 0 0 0 0,-90 60,60 0 0 0 0,120 75,75 0 0 0 0,-150 90,90 0 0 1 0,-180 105,105 0 0 0 0,-210 120,120 0 0 0 0,240 135,135 0 0 0 0,-270 150,150 0 0 0 0,300 165,165 0 0 0 0,-330 180,180 0 0 0 0,360 195,195 0 0 0 0,-389.999998 210,210 0 0 0 0,419.999998 225,225 0 0 0 0,-449.999998 240,240 0 0 0 0,479.999998 255,255 0 0 0 0,-509.999998 m 0,749.999998 a 375,375 0 0 0 0,-749.999998 375,375 0 0 0 0,749.999998" fill="none" stroke="#FF6700" stroke-width="1.298" stroke-linecap="round"/>
  </g>

  <text x="64" y="100" class="mono" font-size="22" letter-spacing="3" fill="#2DD4BF">WAM &#183; ACTION HEAD</text>
  <text x="64" y="140" class="sans" font-size="24" fill="#A8A29E">One feature vector in &#8212; a whole chunk of the next second out.</text>

  <text x="64" y="196" class="mono" font-size="20" letter-spacing="2.5" fill="#2DD4BF">FEATURES IN</text>

  <!-- Input -->
  <rect x="64" y="220" width="1072" height="104" rx="12" fill="#1F1F1F" stroke="#2A2A2A"/>
  <text x="92" y="266" class="disp" font-size="30" fill="#F5F5F4">Backbone features</text>
  <text x="1108" y="264" text-anchor="end" class="mono" font-size="17" fill="#78716C">[B, F]</text>
  <text x="92" y="300" class="mono" font-size="18" fill="#78716C">intermediate activations &#183; leading token dims are mean-pooled</text>
  <line x1="600" y1="324" x2="600" y2="352" class="flow" marker-end="url(#arrow)"/>

  <!-- Trunk -->
  <rect x="64" y="356" width="1072" height="96" rx="12" fill="#1F1F1F" stroke="#2A2A2A"/>
  <text x="92" y="400" class="disp" font-size="26" fill="#F5F5F4">MLP trunk</text>
  <text x="1108" y="398" text-anchor="end" class="mono" font-size="17" fill="#78716C">lightweight</text>
  <text x="92" y="430" class="mono" font-size="18" fill="#78716C">Linear &#183; LayerNorm &#183; GELU</text>

  <!-- Split -->
  <path class="flow" d="M600,452 L600,478 M324,478 L876,478 M324,478 L324,500"/>
  <line x1="324" y1="478" x2="324" y2="502" class="flow" marker-end="url(#arrow)"/>
  <line x1="876" y1="478" x2="876" y2="502" class="flow" marker-end="url(#arrow)"/>

  <!-- Two heads -->
  <rect x="64" y="506" width="520" height="150" rx="12" fill="#1F1F1F" stroke="#2A2A2A"/>
  <text x="92" y="552" class="mono" font-size="24" fill="#F5F5F4">target_head</text>
  <text x="92" y="590" class="mono" font-size="20" fill="#2DD4BF">tanh -&gt; (-1, 1)</text>
  <text x="92" y="626" class="sans" font-size="18" fill="#A8A29E">[T, D] per-step joint deltas</text>

  <rect x="616" y="506" width="520" height="150" rx="12" fill="#1F1F1F" stroke="#2A2A2A"/>
  <text x="644" y="552" class="mono" font-size="24" fill="#F5F5F4">gripper_head</text>
  <text x="644" y="590" class="mono" font-size="20" fill="#2DD4BF">sigmoid -&gt; (0, 1)</text>
  <text x="644" y="626" class="sans" font-size="18" fill="#A8A29E">[T, G], averaged to one value</text>

  <!-- Merge -->
  <path class="flow" d="M324,656 L324,682 M324,682 L876,682 M876,656 L876,682"/>
  <line x1="600" y1="682" x2="600" y2="706" class="flow" marker-end="url(#arrow)"/>

  <!-- The chunk -->
  <rect x="64" y="710" width="1072" height="176" rx="12" fill="#1F1F1F" stroke="#2A2A2A"/>
  <text x="92" y="744" class="mono" font-size="19" letter-spacing="2" fill="#2DD4BF">ONE ACTION CHUNK &#183; 8&#8211;32 STEPS &#183; dt_s APART</text>
  <rect x="92" y="762" width="56" height="64" rx="6" fill="rgba(255,103,0,0.16)" stroke="#FF6700"/>
  <rect x="156" y="762" width="56" height="64" rx="6" fill="rgba(255,103,0,0.16)" stroke="#FF6700"/>
  <rect x="220" y="762" width="56" height="64" rx="6" fill="rgba(255,103,0,0.16)" stroke="#FF6700"/>
  <rect x="284" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="348" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="412" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="476" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="540" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="604" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="668" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="732" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="796" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="860" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="924" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="988" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <rect x="1052" y="762" width="56" height="64" rx="6" fill="#292929" stroke="#3D3D3D"/>
  <text x="92" y="862" class="mono" font-size="17" fill="#FF8534">the executed prefix</text>
  <text x="1108" y="862" text-anchor="end" class="mono" font-size="17" fill="#78716C">discarded at the next re-plan</text>

  <!-- The unit contract (hero) -->
  <rect x="64" y="906" width="1072" height="150" rx="12" fill="rgba(255,103,0,0.10)" stroke="#FF6700" filter="url(#soft)"/>
  <rect x="64" y="906" width="7" height="150" rx="3.5" fill="#FF6700"/>
  <text x="92" y="948" class="mono" font-size="20" letter-spacing="2" fill="#FF6700">THE UNIT CONTRACT</text>
  <text x="92" y="992" class="disp" font-size="30" fill="#F5F5F4">The bounded output is already radians.</text>
  <text x="92" y="1028" class="sans" font-size="19" fill="#A8A29E">No denormalization step exists &#8212; every per-step delta in the data must stay below 1.</text>

  <text x="64" y="1104" class="sans" font-size="20" fill="#78716C">Soft bounds only. Hard limits belong to the safety layer, downstream.</text>

  <text x="64" y="1158" class="disp" font-size="30"><tspan fill="#F5F5F4">Em</tspan><tspan fill="#FF6700">AI</tspan></text>
  <text x="1136" y="1158" text-anchor="end" class="mono" font-size="20" letter-spacing="1" fill="#78716C">emai.dev</text>

  <rect x="0" y="0" width="1200" height="16" fill="url(#tape)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#FF6700"/>
  <rect x="0" y="14" width="1200" height="2" fill="#FF6700"/>
  <rect x="0" y="1184" width="1200" height="16" fill="url(#tape)"/>
  <rect x="0" y="1184" width="1200" height="2" fill="#FF6700"/>
  <rect x="0" y="1198" width="1200" height="2" fill="#FF6700"/>
</svg>
