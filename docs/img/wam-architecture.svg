<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="WAM runtime architecture: camera frames, robot state and a language instruction enter a policy in which a state encoder, a swappable video backbone and an action head produce a canonical action chunk; a deterministic safety layer filters every chunk before the G1 adapter executes only its first steps; and one G1Transport seam carries that same code onto a fake robot, MuJoCo physics or the real Unitree G1 over DDS.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.30" r="0.72">
      <stop offset="0" stop-color="#FF6700" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF6700" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
    <pattern id="tape" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="13" height="26" fill="#FF6700"/>
      <rect x="13" width="13" height="26" fill="#0A0A0A"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#FF6700" stroke-width="1.4"/>
    </marker>
    <style>
      .disp { font-family: 'Space Grotesk','Helvetica Neue',Arial,sans-serif; font-weight:700; letter-spacing:-0.5px; }
      .sans { font-family: 'Geist','Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'Geist Mono',ui-monospace,Menlo,monospace; }
      .lead { stroke:#3D3D3D; stroke-width:1.4; fill:none; }
      .flow { stroke:#FF6700; stroke-width:3; opacity:0.45; }
    </style>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#glow)"/>
  <rect width="1200" height="1500" fill="url(#grid)"/>

  <g opacity="0.08" transform="translate(1008,240) scale(1.54074) translate(-603.84613,-386.53845) translate(-3.8461304,13.461548)">
    <path d="m 603.84613,761.53845 a 15,15 0 0 0 0,-30 30,30 0 0 1 0,-60 45,45 0 0 0 0,-90 60,60 0 0 0 0,120 75,75 0 0 0 0,-150 90,90 0 0 1 0,-180 105,105 0 0 0 0,-210 120,120 0 0 0 0,240 135,135 0 0 0 0,-270 150,150 0 0 0 0,300 165,165 0 0 0 0,-330 180,180 0 0 0 0,360 195,195 0 0 0 0,-389.999998 210,210 0 0 0 0,419.999998 225,225 0 0 0 0,-449.999998 240,240 0 0 0 0,479.999998 255,255 0 0 0 0,-509.999998 m 0,749.999998 a 375,375 0 0 0 0,-749.999998 375,375 0 0 0 0,749.999998" fill="none" stroke="#FF6700" stroke-width="1.298" stroke-linecap="round"/>
  </g>

  <text x="64" y="100" class="mono" font-size="22" letter-spacing="3" fill="#2DD4BF">WAM &#183; RUNTIME ARCHITECTURE</text>
  <text x="64" y="140" class="sans" font-size="24" fill="#A8A29E">From pixels to joints &#8212; and the contracts that make every box swappable.</text>

  <text x="84" y="196" class="mono" font-size="20" letter-spacing="2.5" fill="#2DD4BF">THE RUNTIME PATH</text>
  <text x="876" y="196" class="mono" font-size="20" letter-spacing="2.5" fill="#2DD4BF">WHAT SWAPS HERE</text>

  <!-- 1. Observation -->
  <rect x="84" y="230" width="760" height="112" rx="12" fill="#1F1F1F" stroke="#2A2A2A"/>
  <text x="112" y="280" class="disp" font-size="32" fill="#F5F5F4">Observation</text>
  <text x="112" y="314" class="mono" font-size="20" fill="#78716C">camera frames &#183; RobotState &#183; instruction</text>
  <line x1="464" y1="342" x2="464" y2="378" class="flow" marker-end="url(#arrow)"/>

  <!-- 2. Policy -->
  <rect x="84" y="382" width="760" height="268" rx="12" fill="#1F1F1F" stroke="#2A2A2A"/>
  <text x="112" y="428" class="disp" font-size="30" fill="#F5F5F4">Policy</text>
  <text x="816" y="426" text-anchor="end" class="mono" font-size="18" fill="#78716C">predict(obs) -&gt; ActionChunk</text>

  <rect x="112" y="452" width="704" height="56" rx="9" fill="#292929" stroke="#3D3D3D"/>
  <text x="136" y="487" class="disp" font-size="24" fill="#F5F5F4">StateMLP</text>
  <text x="792" y="487" text-anchor="end" class="mono" font-size="17" fill="#78716C">q, dq, imu, gripper -&gt; [E]</text>

  <rect x="112" y="518" width="704" height="56" rx="9" fill="rgba(45,212,191,0.12)" stroke="#2DD4BF"/>
  <text x="136" y="553" class="disp" font-size="24" fill="#F5F5F4">WanFlowBackbone</text>
  <text x="792" y="553" text-anchor="end" class="mono" font-size="17" fill="#2DD4BF">Wan2.2-TI2V-5B + LoRA</text>

  <rect x="112" y="584" width="704" height="56" rx="9" fill="#292929" stroke="#3D3D3D"/>
  <text x="136" y="619" class="disp" font-size="24" fill="#F5F5F4">ActionHead</text>
  <text x="792" y="619" text-anchor="end" class="mono" font-size="17" fill="#78716C">features -&gt; targets, gripper</text>
  <line x1="464" y1="650" x2="464" y2="686" class="flow" marker-end="url(#arrow)"/>

  <!-- 3. ActionChunk -->
  <rect x="84" y="690" width="760" height="96" rx="12" fill="#1F1F1F" stroke="#2A2A2A"/>
  <text x="112" y="736" class="disp" font-size="28" fill="#F5F5F4">ActionChunk</text>
  <text x="112" y="766" class="mono" font-size="19" fill="#78716C">[T, D] joint deltas in rad &#183; gripper 0&#8211;1 &#183; dt_s</text>
  <line x1="464" y1="786" x2="464" y2="822" class="flow" marker-end="url(#arrow)"/>

  <!-- 4. Safety layer (hero) -->
  <rect x="84" y="826" width="760" height="170" rx="12" fill="rgba(255,103,0,0.10)" stroke="#FF6700" filter="url(#soft)"/>
  <rect x="84" y="826" width="7" height="170" rx="3.5" fill="#FF6700"/>
  <text x="112" y="878" class="disp" font-size="34" fill="#F5F5F4">Safety Layer</text>
  <text x="816" y="876" text-anchor="end" class="mono" font-size="18" fill="#FF8534">filter(state, chunk)</text>
  <text x="112" y="912" class="mono" font-size="20" letter-spacing="2" fill="#FF6700">DETERMINISTIC &#183; NO ML &#183; NEVER BYPASSED</text>
  <text x="112" y="948" class="mono" font-size="18" fill="#A8A29E">joint &#183; velocity &#183; accel &#183; workspace &#183; gripper rate &#183; NaN</text>
  <text x="112" y="976" class="mono" font-size="17" fill="#78716C">every modification logged as a SafetyIntervention</text>
  <line x1="464" y1="996" x2="464" y2="1032" class="flow" marker-end="url(#arrow)"/>

  <!-- 5. Robot adapter -->
  <rect x="84" y="1036" width="760" height="112" rx="12" fill="#1F1F1F" stroke="#2A2A2A"/>
  <text x="112" y="1084" class="disp" font-size="30" fill="#F5F5F4">G1Adapter</text>
  <text x="816" y="1082" text-anchor="end" class="mono" font-size="18" fill="#78716C">execute(chunk, prefix_steps)</text>
  <text x="112" y="1116" class="mono" font-size="19" fill="#78716C">canonical &lt;-&gt; vendor units &#183; joint map &#183; latched e-stop</text>
  <line x1="464" y1="1148" x2="464" y2="1184" class="flow" marker-end="url(#arrow)"/>

  <!-- 6. The hardware seam -->
  <rect x="84" y="1188" width="760" height="136" rx="12" fill="#1F1F1F" stroke="#2A2A2A"/>
  <text x="112" y="1222" class="mono" font-size="19" letter-spacing="2" fill="#2DD4BF">ONE SEAM &#183; THREE IMPLEMENTATIONS</text>
  <rect x="112" y="1238" width="224" height="72" rx="9" fill="#292929" stroke="#3D3D3D"/>
  <text x="132" y="1276" class="disp" font-size="24" fill="#F5F5F4">Fake</text>
  <text x="132" y="1300" class="mono" font-size="15" fill="#78716C">in-process, tests</text>
  <rect x="352" y="1238" width="224" height="72" rx="9" fill="#292929" stroke="#3D3D3D"/>
  <text x="372" y="1276" class="disp" font-size="24" fill="#F5F5F4">MuJoCo</text>
  <text x="372" y="1300" class="mono" font-size="15" fill="#78716C">physics + pixels</text>
  <rect x="592" y="1238" width="224" height="72" rx="9" fill="#292929" stroke="#3D3D3D"/>
  <text x="612" y="1276" class="disp" font-size="24" fill="#F5F5F4">DDS</text>
  <text x="612" y="1300" class="mono" font-size="15" fill="#78716C">the real G1 bus</text>

  <!-- Right rail: the swap points -->
  <line x1="848" y1="546" x2="868" y2="546" class="lead" stroke-dasharray="3 4"/>
  <text x="876" y="542" class="mono" font-size="21" fill="#2DD4BF">FlowBackbone</text>
  <text x="876" y="570" class="sans" font-size="17" fill="#78716C">tiny &#183; wan_i2v &#183; flux3</text>

  <line x1="848" y1="911" x2="868" y2="911" class="lead" stroke-dasharray="3 4"/>
  <text x="876" y="907" class="mono" font-size="21" fill="#2DD4BF">SafetyFilter</text>
  <text x="876" y="935" class="sans" font-size="17" fill="#78716C">exactly one, on purpose</text>

  <line x1="848" y1="1092" x2="868" y2="1092" class="lead" stroke-dasharray="3 4"/>
  <text x="876" y="1088" class="mono" font-size="21" fill="#2DD4BF">RobotAdapter</text>
  <text x="876" y="1116" class="sans" font-size="17" fill="#78716C">mock &#183; g1 &#183; mujoco_g1</text>

  <line x1="848" y1="1256" x2="868" y2="1256" class="lead" stroke-dasharray="3 4"/>
  <text x="876" y="1252" class="mono" font-size="21" fill="#2DD4BF">G1Transport</text>
  <text x="876" y="1280" class="sans" font-size="17" fill="#78716C">fake &#183; mujoco &#183; dds</text>

  <text x="84" y="1364" class="sans" font-size="20" fill="#A8A29E">Above the G1Transport line, the same code runs in all three cases.</text>
  <text x="84" y="1396" class="sans" font-size="20" fill="#78716C">The whole path runs once per control cycle &#8212; MVP floor 2 Hz.</text>

  <text x="64" y="1458" class="disp" font-size="30"><tspan fill="#F5F5F4">Em</tspan><tspan fill="#FF6700">AI</tspan></text>
  <text x="1136" y="1458" text-anchor="end" class="mono" font-size="20" letter-spacing="1" fill="#78716C">emai.dev</text>

  <rect x="0" y="0" width="1200" height="16" fill="url(#tape)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#FF6700"/>
  <rect x="0" y="14" width="1200" height="2" fill="#FF6700"/>
  <rect x="0" y="1484" width="1200" height="16" fill="url(#tape)"/>
  <rect x="0" y="1484" width="1200" height="2" fill="#FF6700"/>
  <rect x="0" y="1498" width="1200" height="2" fill="#FF6700"/>
</svg>
